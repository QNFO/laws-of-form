<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cocycle Visualizer | Cocyle</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  body{margin:0;background:#fdfcfa}
  .back{padding:8px 16px}.back a{color:#8b4513;text-decoration:none;font-family:"Segoe UI",Arial,sans-serif;font-size:14px}
  .wrap{max-width:800px;margin:0 auto;padding:0 16px 2rem}
  canvas{display:block;width:100%;height:420px;border:1px solid #e0ddd5;background:#fafaf7;margin:12px 0}
  .ctrls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
  .ctrls button{padding:8px 18px;border:none;cursor:pointer;font-family:"Segoe UI",Arial,sans-serif;font-size:14px;border-radius:4px;color:#fff}
  .btn-go{background:#8b4513}.btn-step{background:#666}.btn-reset{background:#888}
  .dw{font-family:"SFMono-Regular",Consolas,monospace;font-size:16px;margin-left:auto;color:#5e5e5e}
  .log{font-family:"SFMono-Regular",Consolas,monospace;font-size:13px;max-height:180px;overflow-y:auto;background:#f5f2ec;padding:10px 14px;border:1px solid #e0ddd5;line-height:1.6}
  .log .v{color:#b0562a}.log .ok{color:#2a6e4f}
  .status{padding:12px 16px;margin:12px 0;border-radius:4px;display:none}
  .status.show{display:block}.status.ok{background:#eaf5ea;border-left:3px solid #2a6e4f}
</style>
</head>
<body>
<div class="back"><a href="../index.html">← The Branch and the Shadow</a></div>
<div class="wrap">
  <h1>🧩 Cocycle Resolution Visualizer</h1>
  <p style="color:#5e5e5e;margin-bottom:12px">Three belief patches (A,B,C) on an ultrametric tree. When δω≠0, gradient descent toward consistency.</p>
  <div class="ctrls">
    <button class="btn-go" id="ba">▶ Animate</button>
    <button class="btn-step" id="bs">⏭ Step</button>
    <button class="btn-reset" id="br">↺ Reset</button>
    <span class="dw">δω = <strong id="dwv">—</strong></span>
  </div>
  <canvas id="cv"></canvas>
  <div class="log" id="log"><span style="color:#888">Press ▶ to animate</span></div>
  <div class="status" id="st"></div>
</div>
<script>
(function(){
  var D=5,P=2,N=Math.pow(P,D),pos=[3,15,28],init=[3,15,28],step=0,iv=null;
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  var colors=['#e07030','#3080d0','#30a060'];
  function lca(i,j){var d=0;for(var b=D-1;b>=0;b--){if(((i>>b)&1)===((j>>b)&1))d++;else break}return D-d}
  function cnorm(){var d01=lca(pos[0],pos[1]),d02=lca(pos[0],pos[2]),d12=lca(pos[1],pos[2]);return Math.max(0,d01-Math.max(d02,d12))+Math.max(0,d02-Math.max(d01,d12))+Math.max(0,d12-Math.max(d01,d02))}
  function draw(){
    var W=cv.width,H=cv.height,mx=20,my=30,bx=W-20,by=H-40,sp=(bx-mx)/(N-1),lvlH=(by-my)/D;
    ctx.clearRect(0,0,W,H);
    (function br(lv,s,e,px,py){if(lv>=D)return;var y=my+lv*lvlH,segs=[],ss=s;
      for(var i=s+1;i<=e;i++){var same=true;for(var b=D-1;b>=D-1-lv;b--){if(((ss>>b)&1)!==((i>>b)&1)){same=false;break}}if(!same){segs.push({s:ss,e:i-1});ss=i}}
      segs.push({s:ss,e:e});
      for(var si=0;si<segs.length;si++){var sg=segs[si],mX=mx+((sg.s+sg.e)/2)*sp;
        if(px!==null){ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(mX,y);ctx.strokeStyle='#ddd';ctx.lineWidth=0.5;ctx.stroke()}
        br(lv+1,sg.s,sg.e,mX,y)})(0,0,N-1,null,null);
    for(var i=0;i<N;i++){ctx.beginPath();ctx.arc(mx+i*sp,by,1.5,0,6.283);ctx.fillStyle='#ddd';ctx.fill()}
    for(var p=0;p<3;p++){var x=mx+pos[p]*sp;ctx.beginPath();ctx.arc(x,by,10,0,6.283);ctx.fillStyle=colors[p];ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=1.5;ctx.stroke();ctx.font='bold 13px sans-serif';ctx.fillStyle=colors[p];ctx.fillText(['A','B','C'][p],x+14,by+4)}
    var ps=[[0,1],[0,2],[1,2]],dv=cnorm();
    for(var pi=0;pi<3;pi++){var a=pos[ps[pi][0]],b=pos[ps[pi][1]],ax=mx+a*sp,bx2=mx+b*sp,d=lca(a,b);ctx.beginPath();ctx.setLineDash([4,4]);ctx.moveTo(ax,by-20-pi*4);ctx.lineTo(bx2,by-20-pi*4);ctx.strokeStyle=dv>0?'rgba(180,80,40,.7)':'rgba(40,100,60,.7)';ctx.lineWidth=1;ctx.stroke();ctx.setLineDash([]);ctx.font='10px monospace';ctx.fillStyle=dv>0?'#b05028':'#28643c';ctx.fillText('d='+d,(ax+bx2)/2-10,by-25-pi*4)}
    document.getElementById('dwv').textContent=dv.toFixed(1);
  }
  function stepOnce(){var dv=cnorm();if(dv===0)return;for(var i=0;i<3;i++){var j=(i+1)%3,k=(i+2)%3,mid=Math.round((pos[j]+pos[k])/2);pos[i]=Math.max(0,Math.min(N-1,Math.round(pos[i]+(mid-pos[i])*.5)))}step++;var nd=cnorm(),el=document.getElementById('log'),cls=nd===0?'ok':'v';el.innerHTML+='<div class="'+cls+'">Step '+step+': δω='+nd.toFixed(1)+' ['+pos+']</div>';el.scrollTop=el.scrollHeight;draw();if(nd===0){clearInterval(iv);iv=null;var st=document.getElementById('st');st.textContent='✓ Resolved after '+step+' steps. δω = 0.';st.className='status show ok'}}
  function reset(){clearInterval(iv);iv=null;pos=[].concat(init);step=0;document.getElementById('log').innerHTML='<span style="color:#888">Press ▶ to animate</span>';document.getElementById('st').className='status';document.getElementById('dwv').textContent=cnorm().toFixed(1);draw()}
  function animate(){reset();document.getElementById('log').innerHTML='';iv=setInterval(stepOnce,400)}
  document.getElementById('ba').addEventListener('click',animate);
  document.getElementById('bs').addEventListener('click',stepOnce);
  document.getElementById('br').addEventListener('click',reset);
  cv.width=800;cv.height=450;draw();
  window.addEventListener('resize',function(){cv.width=cv.clientWidth||600;cv.height=Math.max(400,(cv.clientWidth||600)*.55);draw()});
  reset();
})();
</script>
</body>
</html>
